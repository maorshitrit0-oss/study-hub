# Imports a lecturer's course website (public Notion page + sub-pages + attached files) into a course.
# Started by the web app (workflow_dispatch) from the course page.
name: import-site

permissions:
  contents: read
  actions: write   # course_site.py starts process.yml for recordings (this year's and last year's)

on:
  # Every half hour: has a lecturer added a recording or files? (re-read only; chapters are written by the daily run)
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: Site URL (empty = daily run - re-read imported sites, continue writing chapters)
        default: ""
      course_id:
        description: Course id (empty = only show what would be imported)
        default: ""

concurrency:
  group: site-${{ github.event_name }}

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt
      - name: Import
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          EVENT: ${{ github.event_name }}
          SITE_URL: ${{ inputs.url }}
          COURSE_ID: ${{ inputs.course_id }}
        # Inputs arrive as environment variables (never pasted into the script).
        run: |
          if [ "$EVENT" = "schedule" ]; then python course_site.py check; exit 0; fi
          if [ -z "$SITE_URL" ]; then python course_site.py pending; exit 0; fi
          [[ "$SITE_URL" =~ ^https:// ]] || { echo "::error::bad url"; exit 1; }
          if [ -z "$COURSE_ID" ]; then python course_site.py show "$SITE_URL"; exit 0; fi
          [[ "$COURSE_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::bad course id"; exit 1; }
          python course_site.py import "$COURSE_ID" "$SITE_URL"
