# Weekly backup of all his study data (worker/backup.py): every table and every storage file, encrypted with
# backup/backup_pub.pem and kept as a release "backup-<date>" (last 8 kept). The private key is in his Google Drive
# ("study-hub - מפתח גיבוי"), never in the repository. Restoring: docs/BACKUP.md.
name: backup

on:
  schedule:
    - cron: "41 1 * * 0"   # Sunday ~03:41-04:41 Israel time
  workflow_dispatch:
    inputs:
      full:
        description: "true = every file (a full copy); otherwise only files new since the last backup"
        default: "false"

permissions:
  contents: write

concurrency:
  group: backup

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q supabase
      - name: download everything
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ inputs.full }}
        # Incremental by default (12/11/2026): only files new / changed since the latest backup release; restore = the
        # latest full backup, then every later "backup-inc-" in order (docs/BACKUP.md).
        run: |
          since=""
          if [ "$FULL" != "true" ]; then
            since=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.tag_name | startswith("backup-"))][0].created_at // ""')
          fi
          echo "since=$since" >> "$GITHUB_ENV"
          python backup.py dump "$RUNNER_TEMP/data" "$since"
      - name: pack and encrypt
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          tar -czf data.tgz data
          openssl rand -hex 32 > key.bin   # text (a binary key can hold a newline, which -pass file: cuts at)
          # The file is encrypted with a random key; that key is encrypted with the public key (only his private key opens it).
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in data.tgz -out backup.tgz.enc -pass file:key.bin
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/backup/backup_pub.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in key.bin -out key.bin.enc
          rm -rf data data.tgz key.bin
          split -b 1900m -d backup.tgz.enc backup.tgz.enc.part
          rm backup.tgz.enc
          ls -la
      - name: keep as a release (last 8)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          if [ -n "$since" ]; then tag="backup-inc-$(date -u +%Y-%m-%d-%H%M)"; else tag="backup-$(date -u +%Y-%m-%d-%H%M)"; fi
          gh release create "$tag" key.bin.enc backup.tgz.enc.part* --repo "$GITHUB_REPOSITORY" \
            --title "$tag" --notes "Encrypted weekly backup (worker/backup.py). Restore: docs/BACKUP.md" \
            --prerelease --latest=false
          # keep the last 2 full backups and every incremental one after the older of them
          keep_from=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select((.tag_name | startswith("backup-")) and (.tag_name | startswith("backup-inc-") | not))] | sort_by(.created_at) | reverse | .[1].created_at // ""')
          if [ -n "$keep_from" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select((.tag_name | startswith(\"backup-\")) and .created_at < \"$keep_from\") | .tag_name" \
              | while read -r old; do gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; done
          fi
          echo "::notice title=Backup::$tag saved"
