# Processes one lesson: download the Zoom recording (or web page), snapshot the board,
# transcribe the Hebrew audio, and write the reading chapter + quiz with Gemini.
# Started by the web app (workflow_dispatch) when a link is added.
name: process-lesson

permissions:
  contents: read
  actions: write   # course_site.py starts process.yml for recordings (this year's and last year's)

on:
  workflow_dispatch:
    inputs:
      lesson_id:
        description: Lesson id
        required: true
      author:
        description: "gemini = write the chapter automatically, none = transcribe only (Claude writes it)"
        default: gemini
      keep_exercises:
        description: "1 = re-author the chapter but keep the lesson's exercises"
        default: "0"
      mode:
        description: "auto = summary + exercises for lectures/practices, full = the full reading chapter (he asked)"
        default: auto

concurrency:
  group: lesson-${{ inputs.lesson_id }}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # a YouTube lecture + waiting for last year's + writing; public repo: minutes are free
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt && pip install -q -U --pre yt-dlp   # nightly: Zoom / YouTube changes are fixed there first
      - name: Cache the Hebrew transcription model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-ivrit-turbo-v1
      - name: Process
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          LESSON_ID: ${{ inputs.lesson_id }}
          AUTHOR: ${{ inputs.author }}
          AUTHOR_MODE: ${{ inputs.mode || 'auto' }}
          KEEP_EXERCISES: ${{ inputs.keep_exercises || '0' }}
        # Inputs arrive as environment variables (never pasted into the script) and the id must be a UUID.
        run: |
          [[ "$LESSON_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::bad lesson id"; exit 1; }
          [[ "$AUTHOR_MODE" =~ ^(auto|full)$ ]] || { echo "::error::bad mode"; exit 1; }
          if [ "$AUTHOR" = "none" ]; then python hub.py process "$LESSON_ID" --no-author; else python hub.py process "$LESSON_ID"; fi
