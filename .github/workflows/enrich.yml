# Rewrites existing chapters into his structure (background -> explanation -> everyday example -> worked example).
# Dispatched by hand and every morning by /api/cron/notify; lessons already done are skipped, and when the free
# Gemini quota runs out it stops and continues the next morning.
name: enrich

on:
  workflow_dispatch:
    inputs:
      lesson_id:
        description: "one lesson (empty = all not yet restructured)"
        default: ""

permissions:
  contents: read

concurrency:
  group: enrich

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install supabase google-genai
      - working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LESSON_ID: ${{ inputs.lesson_id }}
        run: |
          [[ -z "$LESSON_ID" || "$LESSON_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::bad lesson id"; exit 1; }
          python enrich.py $LESSON_ID
