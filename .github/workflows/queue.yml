# The line of lessons, worked continuously in one job (worker/queue_runner.py loop): GitHub's half-hourly schedule
# fires only every few hours, so the app starts this whenever it puts a lesson in line. One at a time.
name: queue

permissions:
  contents: read
  actions: write   # hands a lesson to claude-chapter.yml / starts the next queue run

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"   # backup, in case nothing started it

concurrency:
  group: queue

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt
      - name: Cache the Hebrew transcription model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-ivrit-turbo-v1
      - working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: python queue_runner.py --loop
