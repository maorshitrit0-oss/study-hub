# Exercises from a course's files (homework, past exams, exercise sheets) -> the exercises table, with solutions.
# Started from the course's exercises page; the daily site run also continues it for every course.
name: exercises

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      course_id:
        description: Course id (empty = every course)
        default: ""

concurrency:
  group: exercises

jobs:
  exercises:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt
      - name: Read exercises
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          COURSE_ID: ${{ inputs.course_id }}
        run: |
          [[ -z "$COURSE_ID" || "$COURSE_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::bad course id"; exit 1; }
          python exercises.py $COURSE_ID
          python docs.py
