# Publishes content Claude wrote in a session (it has no database keys there): a lesson from chapters/<name>.json
# (hub.py add) and/or a course help sheet from chapters/<name>.md (hub.py sheet). Dispatched by hand.
name: publish

on:
  workflow_dispatch:
    inputs:
      course:
        description: "course name (regex, must match one course)"
        required: true
      chapter:
        description: "chapters/*.json to add as a lesson (empty = none)"
        default: ""
      kind:
        default: "practice"
      number:
        default: "0"
      title:
        default: ""
      sheet:
        description: "chapters/*.md to save as the course help sheet (empty = none)"
        default: ""
      inspect:
        description: "true = only print diagnostics for course/kind/number"
        default: "false"

permissions:
  contents: write
  actions: write   # studio-retry starts media.yml
  models: read   # GitHub Models backup when Gemini is busy (24/11/2026)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4   # the site renderer (web/site-check.mjs) for the math fix, 24/11/2026
        with:
          node-version: "22"
      - name: Site renderer packages
        working-directory: web
        run: npm ci --no-audit --no-fund --ignore-scripts >/dev/null 2>&1 || echo "::warning::npm ci failed - math fix skipped"
      - run: pip install -q -r worker/requirements.txt
      - name: browser for the formula-sheet / expected-exam PDF (only when one is published)
        if: inputs.sheet != '' || inputs.inspect == 'forecast'
        run: python -m playwright install --with-deps chromium
      - working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MEDIA_SUPABASE_KEY: ${{ secrets.MEDIA_SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COURSE: ${{ inputs.course }}
          CHAPTER: ${{ inputs.chapter }}
          KIND: ${{ inputs.kind }}
          NUMBER: ${{ inputs.number }}
          TITLE: ${{ inputs.title }}
          SHEET: ${{ inputs.sheet }}
          INSPECT: ${{ inputs.inspect }}
          GITHUB_TOKEN: ${{ github.token }}
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          ok() { [[ -z "$1" || "$1" =~ ^chapters/[A-Za-z0-9_.-]+\.$2$ ]] || { echo "::error::bad path $1"; exit 1; }; }
          ok "$CHAPTER" json; ok "$SHEET" md
          if [ "$INSPECT" = "quiz-code" ]; then python hub.py quiz-code "$COURSE" $( [ "$TITLE" = "apply" ] && echo --apply ); exit $?; fi
          if [ "$INSPECT" = "quiz-add" ]; then python hub.py quiz-add "$COURSE" "$KIND" "$NUMBER" "../$CHAPTER"; exit $?; fi
          if [ "$INSPECT" = "sealed-pub" ]; then python sealed.py pub; exit $?; fi
          if [ "$INSPECT" = "assignments" ]; then python sealed.py open "../$CHAPTER" /tmp/assignments.json && python hub.py assignments "$COURSE" /tmp/assignments.json; exit $?; fi
          if [ "$INSPECT" = "studio-count" ]; then python hub.py studio-count; exit $?; fi
          if [ "$INSPECT" = "studio-redo" ]; then python hub.py studio-redo "$COURSE"; exit $?; fi
          if [ "$INSPECT" = "studio-backfill" ]; then python hub.py studio-backfill "$COURSE"; exit $?; fi
          if [ "$INSPECT" = "studio-list" ]; then python hub.py studio-list "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "studio-new" ]; then python hub.py studio-new "$COURSE" "$NUMBER" "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "studio-retry" ]; then python hub.py studio-retry; exit $?; fi
          if [ "$INSPECT" = "tts" ]; then python hub.py tts; exit $?; fi
          if [ "$INSPECT" = "task" ]; then python hub.py task "$COURSE" "$TITLE" "$NUMBER"; exit $?; fi
          if [ "$INSPECT" = "shrink-dry" ]; then python shrink.py --dry --limit "$NUMBER"; exit $?; fi
          if [ "$INSPECT" = "shrink" ]; then python shrink.py; exit $?; fi
          if [ "$INSPECT" = "prepend" ]; then python hub.py prepend "$COURSE" "$KIND" "$NUMBER" "../$SHEET"; exit $?; fi
          if [ "$INSPECT" = "reorder" ]; then python hub.py reorder "$COURSE" "../$CHAPTER"; exit $?; fi
          if [ "$INSPECT" = "lab-lessons" ]; then python hub.py lab-lessons "$COURSE"; exit $?; fi
          if [ "$INSPECT" = "classex" ]; then python classex.py "$COURSE" && python -c "import hub, weekset, sys; c=hub.find_course(hub.db(), sys.argv[1]); d=weekset.load(hub.db(), c); weekset.run(sys.argv[1])" "$COURSE"; exit $?; fi
          if [ "$INSPECT" = "weekset-drop" ]; then python weekset.py drop "$COURSE" "$NUMBER" "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "sync-undo" ]; then python hub.py sync-undo "${TITLE%%|*}" "${TITLE##*|}"; exit $?; fi
          if [ "$INSPECT" = "merge-repair" ]; then python hub.py merge-repair; exit $?; fi
          if [ "$INSPECT" = "coverage-replace" ]; then python coverage.py --replace "../$CHAPTER"; exit $?; fi
          if [ "$INSPECT" = "coverage-textsym" ]; then python coverage.py --textsym; exit $?; fi
          if [ "$INSPECT" = "coverage-audit" ]; then python coverage.py --audit "$COURSE"; exit $?; fi
          if [ "$INSPECT" = "coverage-extra-clean" ]; then python coverage.py --extra-clean; exit $?; fi
          if [ "$INSPECT" = "coverage-extra" ]; then python coverage.py --extra "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "coverage-lessons" ]; then python coverage.py --lessons "$COURSE"; exit $?; fi
          if [ "$INSPECT" = "coverage-exdump" ]; then python coverage.py --exdump "$COURSE"; exit $?; fi
          if [ "$INSPECT" = "coverage-toopen" ]; then python coverage.py --toopen "$COURSE"; exit $?; fi
          if [ "$INSPECT" = "coverage-unverified" ]; then python coverage.py --unverified $TITLE; exit $?; fi
          if [ "$INSPECT" = "coverage-status" ]; then python coverage.py --status; exit $?; fi
          if [ "$INSPECT" = "coverage-list" ]; then python coverage.py --list; exit $?; fi
          if [ "$INSPECT" = "set-fields" ]; then python hub.py set-fields "../$CHAPTER"; exit $?; fi
          if [ "$INSPECT" = "latex-repair" ]; then python hub.py latex-repair; exit $?; fi
          if [ "$INSPECT" = "coverage-dedupe" ]; then python coverage.py --dedupe; exit $?; fi
          if [ "$INSPECT" = "drop-moodle" ]; then python hub.py drop-moodle; exit $?; fi
          if [ "$INSPECT" = "find-dupes" ]; then python find_dupes.py; exit $?; fi
          if [ "$INSPECT" = "ghm-probe" ]; then python ghm_probe.py; exit $?; fi
          if [ "$INSPECT" = "ghm-test" ]; then python backup_test.py; exit $?; fi
          if [ "$INSPECT" = "board-check" ]; then python -c "import coverage, hub; coverage.board_check_course(hub.db(), '$TITLE')"; exit $?; fi
          if [ "$INSPECT" = "trim-quiz" ]; then python coverage.py --trim-quiz "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "coverage-pending" ]; then python coverage.py --pending "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "coverage-place" ]; then python coverage.py --place "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "coverage-rewrite" ]; then python coverage.py --rewrite "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "refresh-weeks" ]; then python coverage.py --refresh-weeks "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "mathfix" ]; then python coverage.py --mathfix "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "coverage-fix" ]; then python coverage.py --fix-course "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "coverage-redrill" ]; then python coverage.py --redrill "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "coverage-trim" ]; then python coverage.py --trim "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "coverage-focus" ]; then python coverage.py --focus "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "drop-videos" ]; then python coverage.py --drop-videos "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "coverage-restore" ]; then python coverage.py --restore "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "media-clean" ]; then sudo apt-get install -y -qq ffmpeg >/dev/null; python hub.py media-clean --shrink "$NUMBER"; exit $?; fi
          if [ "$INSPECT" = "coverage-step" ]; then python coverage.py 6; exit $?; fi
          if [ "$INSPECT" = "drop-lesson" ]; then python hub.py drop-lesson "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "patch" ]; then python boards.py patch "../$CHAPTER"; exit $?; fi
          if [ "$INSPECT" = "boardfix" ]; then python boards.py fix "../$CHAPTER"; exit $?; fi
          if [ "$INSPECT" = "done-report" ]; then python hub.py done-report; exit $?; fi
          if [ "$INSPECT" = "sync-done" ]; then python hub.py sync-done "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "retitle" ]; then python hub.py retitle "$COURSE" "$KIND" "$NUMBER" "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "weekset-set" ]; then python weekset.py set "$COURSE" "$NUMBER" "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "weekset-clean" ]; then python weekset.py clean "$COURSE"; exit $?; fi
          if [ "$INSPECT" = "weekset-fill" ]; then python -c "import hub, weekset; weekset.fill_missing(hub.db())"; exit $?; fi
          if [ "$INSPECT" = "weekset" ]; then python weekset.py "$COURSE"; exit $?; fi
          if [ "$INSPECT" = "tidy-redo" ]; then python hub.py tidy-redo "$COURSE"; exit $?; fi
          if [ "$INSPECT" = "media-drop-originals" ]; then python mediastore.py drop-originals; exit $?; fi
          if [ "$INSPECT" = "media-sample" ]; then python mediastore.py sample; exit $?; fi
          if [ "$INSPECT" = "media-move" ]; then python mediastore.py move; exit $?; fi
          if [ "$INSPECT" = "media-test" ]; then python mediastore.py test; exit $?; fi
          if [ "$INSPECT" = "requeue" ]; then python hub.py requeue "$COURSE" "$KIND" "$NUMBER"; python queue_runner.py; exit $?; fi
          if [ "$INSPECT" = "course-check" ]; then python hub.py course-check "$COURSE"; exit $?; fi
          if [ "$INSPECT" = "storage" ]; then python storage_report.py; exit $?; fi
          if [ "$INSPECT" = "tidy" ]; then python hub.py tidy "$COURSE"; exit $?; fi
          if [ "$INSPECT" = "forecast" ]; then python hub.py forecast "$COURSE" "../$CHAPTER"; exit $?; fi
          if [ "$INSPECT" = "course-set" ]; then python hub.py course-set "$COURSE" "../$CHAPTER"; exit $?; fi
          if [ "$INSPECT" = "where" ]; then python hub.py where "$COURSE" ${TITLE:+--again}; exit $?; fi
          if [ "$INSPECT" = "core" ]; then python hub.py core "$COURSE" "../$CHAPTER"; exit $?; fi
          if [ "$INSPECT" = "drive" ]; then python hub.py drive "$COURSE" "../$CHAPTER"; exit $?; fi
          if [ "$INSPECT" = "exercises" ]; then python hub.py exercises "$COURSE" "../$CHAPTER"; exit $?; fi
          if [ "$INSPECT" = "flat" ]; then python hub.py flat; exit $?; fi
          if [ "$INSPECT" = "facts" ]; then python facts.py; exit $?; fi
          if [ "$INSPECT" = "facts-force" ]; then python facts.py --force; exit $?; fi
          if [ "$INSPECT" = "topics" ]; then python topics.py; exit $?; fi
          if [ "$INSPECT" = "claude" ]; then echo "::notice title=Claude token::set=$HAS_CLAUDE"; exit 0; fi
          if [ "$INSPECT" = "ping" ]; then python hub.py ping; exit $?; fi
          if [ "$INSPECT" = "stuck" ]; then python hub.py stuck; exit $?; fi
          if [ "$INSPECT" = "queue" ]; then python queue_runner.py; exit $?; fi
          if [ "$INSPECT" = "archive" ]; then python hub.py archive "$COURSE"; exit $?; fi
          if [ "$INSPECT" = "true" ]; then python hub.py inspect "$COURSE" "$KIND" "$NUMBER"; exit $?; fi
          [[ "$KIND" =~ ^(lecture|practice|other|web)$ && "$NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::bad kind/number"; exit 1; }
          if [ -n "$SHEET" ]; then python hub.py sheet "$COURSE" "../$SHEET"; fi
          if [ -n "$CHAPTER" ]; then python hub.py add "$COURSE" "$KIND" "$NUMBER" "$TITLE" "../$CHAPTER"; fi
      - name: remove the throwaway branches of fetch.yml (encrypted lesson material)
        run: |
          for b in $(git ls-remote --heads origin 'fetch/*' | awk '{print $2}' | sed 's#refs/heads/##'); do
            git push -q origin --delete "$b" || true
          done
