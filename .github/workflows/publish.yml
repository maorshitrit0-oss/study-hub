# Publishes content Claude wrote in a session (it has no database keys there): a lesson from chapters/<name>.json
# (hub.py add) and/or a course help sheet from chapters/<name>.md (hub.py sheet). Dispatched by hand.
name: publish

on:
  workflow_dispatch:
    inputs:
      course:
        description: "course name (regex, must match one course)"
        required: true
      chapter:
        description: "chapters/*.json to add as a lesson (empty = none)"
        default: ""
      kind:
        default: "practice"
      number:
        default: "0"
      title:
        default: ""
      sheet:
        description: "chapters/*.md to save as the course help sheet (empty = none)"
        default: ""
      inspect:
        description: "true = only print diagnostics for course/kind/number"
        default: "false"

permissions:
  contents: write
  actions: write   # studio-retry starts media.yml

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r worker/requirements.txt
      - name: browser for the formula-sheet PDF (only when a sheet is published)
        if: inputs.sheet != ''
        run: python -m playwright install --with-deps chromium
      - working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COURSE: ${{ inputs.course }}
          CHAPTER: ${{ inputs.chapter }}
          KIND: ${{ inputs.kind }}
          NUMBER: ${{ inputs.number }}
          TITLE: ${{ inputs.title }}
          SHEET: ${{ inputs.sheet }}
          INSPECT: ${{ inputs.inspect }}
          GITHUB_TOKEN: ${{ github.token }}
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          ok() { [[ -z "$1" || "$1" =~ ^chapters/[A-Za-z0-9_.-]+\.$2$ ]] || { echo "::error::bad path $1"; exit 1; }; }
          ok "$CHAPTER" json; ok "$SHEET" md
          if [ "$INSPECT" = "studio-backfill" ]; then python hub.py studio-backfill "$COURSE"; exit $?; fi
          if [ "$INSPECT" = "studio-list" ]; then python hub.py studio-list "$TITLE"; exit $?; fi
          if [ "$INSPECT" = "studio-retry" ]; then python hub.py studio-retry; exit $?; fi
          if [ "$INSPECT" = "tts" ]; then python hub.py tts; exit $?; fi
          if [ "$INSPECT" = "task" ]; then python hub.py task "$COURSE" "$TITLE" "$NUMBER"; exit $?; fi
          if [ "$INSPECT" = "core" ]; then python hub.py core "$COURSE" "../$CHAPTER"; exit $?; fi
          if [ "$INSPECT" = "drive" ]; then python hub.py drive "$COURSE" "../$CHAPTER"; exit $?; fi
          if [ "$INSPECT" = "exercises" ]; then python hub.py exercises "$COURSE" "../$CHAPTER"; exit $?; fi
          if [ "$INSPECT" = "flat" ]; then python hub.py flat; exit $?; fi
          if [ "$INSPECT" = "facts" ]; then python facts.py; exit $?; fi
          if [ "$INSPECT" = "facts-force" ]; then python facts.py --force; exit $?; fi
          if [ "$INSPECT" = "topics" ]; then python topics.py; exit $?; fi
          if [ "$INSPECT" = "claude" ]; then echo "::notice title=Claude token::set=$HAS_CLAUDE"; exit 0; fi
          if [ "$INSPECT" = "ping" ]; then python hub.py ping; exit $?; fi
          if [ "$INSPECT" = "stuck" ]; then python hub.py stuck; exit $?; fi
          if [ "$INSPECT" = "queue" ]; then python queue_runner.py; exit $?; fi
          if [ "$INSPECT" = "archive" ]; then python hub.py archive "$COURSE"; exit $?; fi
          if [ "$INSPECT" = "true" ]; then python hub.py inspect "$COURSE" "$KIND" "$NUMBER"; exit $?; fi
          [[ "$KIND" =~ ^(lecture|practice|other|web)$ && "$NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::bad kind/number"; exit 1; }
          if [ -n "$SHEET" ]; then python hub.py sheet "$COURSE" "../$SHEET"; fi
          if [ -n "$CHAPTER" ]; then python hub.py add "$COURSE" "$KIND" "$NUMBER" "$TITLE" "../$CHAPTER"; fi
      - name: remove the throwaway branches of fetch.yml (encrypted lesson material)
        run: |
          for b in $(git ls-remote --heads origin 'fetch/*' | awk '{print $2}' | sed 's#refs/heads/##'); do
            git push -q origin --delete "$b" || true
          done
