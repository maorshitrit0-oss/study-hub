# Lets a Claude session (no database keys) read a lesson to write its chapter itself (CLAUDE.md "Writing a chapter
# with Claude"): `hub.py fetch` output, encrypted to the session's one-time public key (the repo is public), pushed to a throwaway branch.
name: fetch

on:
  workflow_dispatch:
    inputs:
      lesson_id:
        required: true
      pubkey:
        description: "base64 of the session's one-time RSA public key (PEM)"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q gdown supabase google-genai python-docx requests trafilatura pywebpush imageio-ffmpeg numpy pillow
      - working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LESSON_ID: ${{ inputs.lesson_id }}
          PUBKEY: ${{ inputs.pubkey }}
        run: |
          if [ "$LESSON_ID" = "summaries" ]; then python hub.py summaries /tmp/lesson
          elif [ "$LESSON_ID" = "weeksets" ]; then python hub.py weeksets-dump /tmp/lesson
          elif [ "$LESSON_ID" = "outline" ]; then python hub.py outline /tmp/lesson
          elif [ "$LESSON_ID" = "media" ]; then python hub.py media-get /tmp/lesson
          elif [[ "$LESSON_ID" =~ ^drive:([-_A-Za-z0-9,]+)$ ]]; then python hub.py drivefiles "${BASH_REMATCH[1]}" /tmp/lesson
          elif [[ "$LESSON_ID" =~ ^files:([^:]+):(.+)$ ]]; then python hub.py materials "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" /tmp/lesson
          else
            [[ "$LESSON_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::bad lesson id"; exit 1; }
            python hub.py fetch "$LESSON_ID" /tmp/lesson
          fi
          tar czf /tmp/l.tgz -C /tmp lesson
          echo "$PUBKEY" | base64 -d > /tmp/pub.pem
          openssl rand -hex 32 > /tmp/k.bin   # text: -pass file: reads one line
          mkdir -p /tmp/out
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/l.tgz -out /tmp/out/l.enc -pass file:/tmp/k.bin
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -in /tmp/k.bin -out /tmp/out/k.enc
      # Artifacts' storage host is not reachable from the session: the encrypted pair goes to a throwaway branch
      # (fetch/<lesson>), which the session deletes after reading.
      - env:
          LESSON_ID: ${{ inputs.lesson_id }}
        run: |
          git config user.name "study-hub fetch"; git config user.email "fetch@users.noreply.github.com"
          BR="fetch/$(printf '%s' "$LESSON_ID" | sha1sum | cut -c1-12)"   # a valid branch name for any request
          git checkout --orphan "$BR"; git rm -rfq .
          cp /tmp/out/* .
          # Vercel builds every pushed branch (root "web"): tell it to skip this one, or it mails him "deployment failed".
          mkdir -p web && printf '{"ignoreCommand": "exit 0", "git": {"deploymentEnabled": false}}\n' > web/vercel.json
          git add l.enc k.enc web/vercel.json; git commit -qm "encrypted lesson material"
          git push -f origin "$BR"
