# Push notifications: morning digest (deadlines, exams, unread chapters) and an evening
# reminder to upload the recordings of today's classes.
# Started by the app (/api/cron/notify), which Supabase pg_cron calls on time: Sun-Thu 08:00 and 20:00,
# Fri 08:00, Sat 20:00 (Israel). GitHub's own schedule ran hours late, so it is not used.
name: notify

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily / evening / setup / test"
        default: daily
      user_id:
        description: "for test: who gets the notification"
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install supabase pywebpush
      - working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODE: ${{ inputs.mode || 'daily' }}
          TARGET_USER: ${{ inputs.user_id }}
        run: |
          case "$MODE" in daily|evening|setup|test) ;; *) echo "::error::bad mode"; exit 1;; esac
          [[ -z "$TARGET_USER" || "$TARGET_USER" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::bad user id"; exit 1; }
          python notify.py "$MODE" $TARGET_USER
      - name: Check free-plan usage (morning run)
        if: inputs.mode == 'daily'
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python usage.py
